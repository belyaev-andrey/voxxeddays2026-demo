spring.main.banner-mode=off
spring.main.web-application-type=none
spring.threads.virtual.enabled=true

# Google Gemini through Vertex AI: GOOGLE_CLOUD_PROJECT and your gcloud application-default login
# (gcloud auth application-default login). The preview models are served from the 'global' location only.
# A key always wins over Vertex AI, so the key is opt-in: set GEMINI_API_KEY to use the Gemini Developer API
# (https://aistudio.google.com/apikey). GOOGLE_API_KEY is not read, because its prepaid credits are used up.
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.project-id=${GOOGLE_CLOUD_PROJECT:}
spring.ai.google.genai.location=${GOOGLE_CLOUD_LOCATION:global}
spring.ai.google.genai.chat.model=gemini-3.1-pro-preview

# Anthropic Claude: to switch back, swap the starter in the pom and uncomment these lines
# spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
# spring.ai.anthropic.chat.max-tokens=2000
# spring.ai.anthropic.chat.model=claude-sonnet-5-5

agent.skills.dirs=classpath:/skills

# RAG: the bank's knowledge base, embedded at startup with a local ONNX model
agent.knowledge.docs=classpath*:/knowledge/*.md
# Stable cache for the ONNX embedding model (~90MB). The default is a new temp dir per run, i.e. a re-download on every start.
spring.ai.embedding.transformer.cache.directory=${user.home}/.spring-ai/model-cache

# Stdio MCP server(s): the exchange-rate server (ECB rates via Frankfurter) started with npx
spring.ai.mcp.client.name=bank-support-agent
spring.ai.mcp.client.request-timeout=60s
spring.ai.mcp.client.stdio.servers-configuration=classpath:/mcp-servers-config.json

spring.ai.inspector.enabled=true
# Hide the MCP stdio transport logs (server stderr is logged at INFO)
logging.level.io.modelcontextprotocol.client.transport.StdioClientTransport=WARN
logging.level.io.modelcontextprotocol.spec.McpClientSession=OFF
